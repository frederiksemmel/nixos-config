[package]
name = "semmeltv-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["connect"] }
topcoat = { version = "=0.11.0", default-features = false, features = ["asset", "compression", "router", "runtime", "serve", "view", "discover"] }
topcoat-asset = { version = "=0.11.0", features = ["bundler"] }

[profile.release]
lto = "thin"
