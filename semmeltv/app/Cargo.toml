[package]
name = "semmeltv"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
cec_linux = { version = "0.2", features = ["poll"] }
deunicode = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-femtovg", "renderer-software"] }
toml = "0.9"
ureq = { version = "3", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = "0.29"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "process", "io-util", "time", "macros", "fs"] }

[build-dependencies]
slint-build = "1.18"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
