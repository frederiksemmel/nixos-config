[package]
name = "epaper"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
embedded-graphics = "0.8.2"
embedded-hal = "1.0"
epd-waveshare = "0.6"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
linux-embedded-hal = { version = "0.5", default-features = false, features = ["gpio_cdev", "spi"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
typst = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-layout = "0.15"
typst-render = "0.15"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
whatsapp-rust = { version = "0.7", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "tokio-native", "ureq-client"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = { version = "0.13", default-features = false }
