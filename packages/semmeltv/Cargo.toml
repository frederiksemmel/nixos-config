[package]
name = "semmeltv"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
cec_linux = { version = "0.2", features = ["poll"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-femtovg", "renderer-software"] }
toml = "0.9"
ureq = { version = "3", features = ["json"] }

[build-dependencies]
slint-build = "1.18"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
